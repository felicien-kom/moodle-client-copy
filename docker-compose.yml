services:

  # ── Backend — Node.js + Express + Prisma + SQLite ────────────
  backend:
    build:
      context: ./backend
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /app
        RUN apk add --no-cache openssl
        COPY package*.json ./
        RUN npm ci --omit=dev
        COPY . .
        RUN npm run db:generate
        RUN mkdir -p /app/data
        EXPOSE 5000
        CMD sh -c "npx prisma migrate deploy && \
                   PRISMA_TARGET=user npx prisma migrate deploy && \
                   node src/server.js"
    container_name: moodle-client-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      CLIENT_PORT: 5000
      HOST: "true"
      # ── À renseigner avant docker compose up --build ──────────
      MOODLE_URL: http://votre-serveur-moodle.fr
      MOODLE_SERVICE: moodle_mobile_app
      JWT_SECRET: changez_cette_valeur_en_production
      # ─────────────────────────────────────────────────────────
      JWT_EXPIRES_IN: 1d
      DATABASE_DIR: /app/data
      CORS_ORIGIN: http://localhost,http://localhost:80
    volumes:
      - moodle_data:/app/data    # bases SQLite persistées entre les redémarrages
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Frontend — React + Vite buildé, servi par Nginx ──────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api/v1
      dockerfile_inline: |
        FROM node:22-alpine AS builder
        WORKDIR /app
        ARG VITE_API_URL=http://localhost:5000/api/v1
        ENV VITE_API_URL=$VITE_API_URL
        COPY package*.json ./
        RUN npm ci
        COPY . .
        RUN npm run build

        FROM nginx:alpine
        COPY --from=builder /app/dist /usr/share/nginx/html
        RUN printf 'server {\n\
            listen 80;\n\
            root /usr/share/nginx/html;\n\
            index index.html;\n\
            gzip on;\n\
            location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }\n\
            location / { try_files $uri $uri/ /index.html; }\n\
        }' > /etc/nginx/conf.d/default.conf
        EXPOSE 80
    container_name: moodle-client-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  moodle_data:
